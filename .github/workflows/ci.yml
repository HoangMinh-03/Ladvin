name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # same bundler as the committed dist/
      - run: bun install --frozen-lockfile
      - run: bun test packages
      - name: committed bundles are current
        run: bun run build:hub && git diff --exit-code dist/
